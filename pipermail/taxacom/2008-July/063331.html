<!doctype html><html lang="en"><meta charset="utf-8"><title>[Taxacom] Bird Collection Manager Position - Alaska Collection Manager: Birds University of Alaska Museum The University of Alaska Museum of the North is seeking qualified applicants for a position as Collection Manager in the Department of Ornithology. The University of Alaska Museum (UAM) houses the definitive collection of birds from northwesternmost North America and also includes important holdings from major relevant wintering areas. Located in a region that has never had a formal biological survey, this collection has tripled in size during the past decade to about 25,000 specimens; it is an exciting time to be a specimen-based ornithologist. The Collection Manager is responsible for the daily management and development of the Bird Collection, which includes the multiple preparation types typical of modern collections. Duties include all aspects of collection growth and management, such as permitting, collecting expeditions, specimen acquisition and preparation, cat! aloguing and databasing, maintenance, loans, public inquiries and tours, purchasing and budget management, supervision of students and volunteers, and managing the use of the collection. The Collection Manager will assist the Curator in writing proposals and reports of collections-based activities and will also promote the Collection through public outreach, exhibits, reports, and presentations at meetings when appropriate. Minimum qualifications include an advanced degree in an appropriate discipline and experience in specimen-based ornithology (including museum experience), specimen collection and preparation, formal communications on specimen-based science, and data management. The UA Museum is housed in a newly expanded and renovated building on the campus of the University of Alaska Fairbanks, just south of the Arctic Circle in Interior Alaska. More information can be found www.uaf.edu/museum/ and www.uaf.edu/museum/bird/. Fairbanks
